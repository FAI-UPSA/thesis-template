on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - uses: go-task/setup-task@v2
      - run: task build
      - uses: actions/upload-artifact@v7
        with:
          name: Documentos
          path: "documents/**/*.pdf"
