on:
  push:
    branches: [main]
    paths:
      - README.adoc
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'FAI-UPSA/thesis-template' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          sudo gem install asciidoctor
          mkdir -p _site
          asciidoctor --out-file _site/index.html README.adoc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
