version: 3

env:
  TYPST_ROOT: .
  TYPST_FONT_PATHS: assets/fonts

tasks:
  default:
    desc: Genera la propuesta, tesis, currículum y la entrega para la BIME
    deps:
      - proposal
      - bime
  build:
    desc: Genera los documentos principales una sola vez, sin vigilar cambios
    cmds:
      - typst compile documents/cv.typ
      - typst compile --format svg documents/cv.typ
      - typst compile documents/proposal.typ
      - typst compile --pdf-standard ua-1,a-3a documents/thesis.typ
      - typst compile --features bundle --format bundle --pdf-standard ua-1,a-3a documents/book.typ
  cv:
    desc: Genera el currículum en PDF y SVG
    deps:
      - cv:pdf
      - cv:svg
  cv:pdf:
    internal: true
    cmds:
      - typst watch documents/cv.typ
  cv:svg:
    internal: true
    cmds:
      - typst watch --format svg documents/cv.typ
  bime:
    aliases:
      - bime-book
      - book
    desc: Genera la tesis, las cubiertas, el resumen y las referencias para la BIME
    deps:
      - thesis
      - bime:bundle
  bime:bundle:
    internal: true
    env:
      TYPST_FEATURES: bundle
    cmds:
      - typst watch --format bundle --pdf-standard ua-1,a-3a documents/book.typ
  proposal:
    desc: Genera la propuesta en PDF
    cmds:
      - typst watch documents/proposal.typ
  thesis:
    aliases:
      - tfg
    desc: Genera la tesis en PDF/A-3a y PDF/UA-1 y prepara el currículum
    deps:
      - cv
      - thesis:pdf
  thesis:pdf:
    internal: true
    cmds:
      - typst watch --pdf-standard ua-1,a-3a documents/thesis.typ
  study:
    desc: Genera el estudio de factibilidad en PDF
    cmds:
      - typst watch documents/feasibility/study.typ
